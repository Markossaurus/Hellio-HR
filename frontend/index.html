<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidates | Hellio HR</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>Hellio HR</h1>
      <nav>
        <a href="index.html" class="active">Candidates</a>
        <a href="positions.html">Positions</a>
      </nav>
    </div>
  </header>
  
  <main class="container">
    <div class="toolbar mb-2">
      <div class="search-wrapper">
        <input type="search" id="search-input" class="search-box" placeholder="Search candidates...">
      </div>
      <div class="actions">
        <button class="btn btn-outline" id="btn-view-list">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
          List
        </button>
        <button class="btn btn-outline" id="btn-view-compare">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
          Compare
        </button>
      </div>
    </div>
    
    <div id="view-list" class="grid-2">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Active Candidates</span>
        </div>
        <div id="candidate-list"></div>
      </div>
      <div id="candidate-profile"></div>
    </div>
    
    <div id="view-compare" class="hidden">
      <div class="card mb-2">
        <div class="flex">
          <select id="compare-select-1" class="flex-1">
            <option value="">Select first candidate</option>
          </select>
          <select id="compare-select-2" class="flex-1">
            <option value="">Select second candidate</option>
          </select>
        </div>
      </div>
      <div id="compare-container"></div>
    </div>
  </main>
  
  <div class="modal-overlay" id="modal-add-position">
    <div class="modal">
      <div class="modal-header">
        <h3>Add Position</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div id="modal-position-list"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
