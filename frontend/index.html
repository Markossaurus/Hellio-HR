<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidates | Hellio HR</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>Hellio HR</h1>
      <nav>
        <a href="index.html" class="active">Candidates</a>
        <a href="positions.html">Positions</a>
        <a href="#" id="logout-btn" class="nav-logout">Logout</a>
      </nav>
    </div>
  </header>
  
  <main class="container">
    <div class="toolbar mb-2">
      <div class="search-wrapper">
        <input type="search" id="search-input" class="search-box" placeholder="Search candidates...">
      </div>
      <div class="actions">
        <button class="btn btn-outline" id="btn-view-list">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
          List
        </button>
        <button class="btn btn-outline" id="btn-view-compare">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
          Compare
        </button>
        <button class="btn btn-primary" id="btn-upload-cv">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
          Upload CV
        </button>
      </div>
    </div>
    
    <div id="view-list" class="grid-2">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Active Candidates</span>
        </div>
        <div id="candidate-list"></div>
      </div>
      <div id="candidate-profile"></div>
    </div>
    
    <div id="view-compare" class="hidden">
      <div class="card mb-2">
        <div class="flex">
          <select id="compare-select-1" class="flex-1">
            <option value="">Select first candidate</option>
          </select>
          <select id="compare-select-2" class="flex-1">
            <option value="">Select second candidate</option>
          </select>
        </div>
      </div>
      <div id="compare-container"></div>
    </div>
  </main>
  
  <div class="modal-overlay" id="modal-add-position">
    <div class="modal">
      <div class="modal-header">
        <h3>Add Position</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div id="modal-position-list"></div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-upload-cv">
    <div class="modal">
      <div class="modal-header">
        <h3>Upload CV</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body" style="padding: 1.5rem;">
        <div id="upload-dropzone" class="upload-dropzone">
          <div class="dropzone-content">
            <svg class="upload-icon" width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            <p class="upload-text">
              <span class="text-primary" style="cursor: pointer; text-decoration: underline;">Click to upload</span> or drag and drop
            </p>
            <p class="upload-hint">PDF or DOCX up to 10MB</p>
          </div>
          <input id="file-upload" name="file-upload" type="file" class="sr-only" accept=".pdf,.docx">
        </div>

        <div id="upload-progress-container" class="progress-container hidden">
          <div class="progress-info">
            <span id="upload-status-text">Uploading...</span>
            <span id="upload-percentage">0%</span>
          </div>
          <div class="progress-track">
            <div id="upload-progress-bar" class="progress-bar" style="width: 0%"></div>
          </div>
        </div>

        <div id="upload-result" class="hidden"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
