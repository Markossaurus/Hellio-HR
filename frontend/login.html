<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hellio HR</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">👋</div>
                <h1 class="login-title">Welcome Back</h1>
                <p class="login-subtitle">Sign in to Hellio HR</p>
            </div>
            
            <div id="login-error" class="login-error"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="admin@hellio.hr" required autofocus autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">
                    Sign In
                </button>
            </form>
            
            <div style="text-align: center; margin-top: 1.5rem;">
                <p class="text-sm text-muted">
                    Test credentials: admin@hellio.hr / admin123
                </p>
            </div>
        </div>
    </div>

    <script type="module" src="js/login-app.js"></script>
</body>
</html>
