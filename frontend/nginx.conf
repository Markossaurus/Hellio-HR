server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy ALL API requests to backend (strips /api prefix)
    # /api/candidates -> backend:8000/candidates
    # /api/positions -> backend:8000/positions
    # /api/auth/login -> backend:8000/auth/login
    # /api/cv-documents/xxx/download -> backend:8000/cv-documents/xxx/download
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (no /api prefix needed)
    location = /health {
        proxy_pass http://backend:8000/health;
    }
}
